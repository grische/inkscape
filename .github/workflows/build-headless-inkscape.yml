---
# Builds a patched, headless Inkscape image (see .github/headless-image/),
# verifies the inkscape!5419 warning is gone, and publishes it to GHCR.
#
#   https://gitlab.com/inkscape/inkscape/-/work_items/5419
#
# Building Inkscape from source takes roughly 30-60 min on a GitHub-hosted
# runner. The resulting image is consumed by github.com/freifunk/device-pictures.
# Note: this is a fork-only CI branch; enable Actions on the fork to run it, and
# set the published GHCR package to "Public" so other repos can pull it.

name: Build headless Inkscape image

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - ci/headless-inkscape-image
    paths:
      - '.github/headless-image/**'
      - '.github/workflows/build-headless-inkscape.yml'

concurrency:
  group: build-headless-inkscape
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/inkscape

jobs:
  build:
    name: Build, test and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for testing)
        uses: docker/build-push-action@v6
        with:
          context: .github/headless-image
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test - headless export must not emit "Failed to wrap object" warnings
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="red"/></svg>' \
            > sample.svg
          out=$(docker run --rm -e HOME=/tmp -v "$PWD:/work" -w /work "${IMAGE}:test" \
              inkscape sample.svg --batch-process --export-type=png \
              --export-filename=out.png --export-background-opacity=0 2>&1) || true
          echo "----- inkscape output -----"
          echo "$out"
          echo "---------------------------"
          # Catches both GtkRecentManager (5419) and PangoFT2FontMap, and any
          # other headless wrap warning of the same family.
          if echo "$out" | grep -qi "Failed to wrap object of type"; then
            echo "FAIL: a 'Failed to wrap object' warning is still present"
            exit 1
          fi
          if [ ! -f out.png ]; then
            echo "FAIL: no PNG was produced"
            exit 1
          fi
          echo "PASS: warning gone and PNG produced"

      - name: Push image
        if: github.ref == 'refs/heads/ci/headless-inkscape-image'
        uses: docker/build-push-action@v6
        with:
          context: .github/headless-image
          push: true
          tags: |
            ${{ env.IMAGE }}:1.4.2-headless
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Inkscape 1.4.2 (GTK3) patched for inkscape#5419 (no headless GtkRecentManager warning).
          cache-from: type=gha
          cache-to: type=gha,mode=max
